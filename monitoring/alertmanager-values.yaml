alertmanager:
  alertmanagerSpec:
    secrets: 
      - alertmanager-gmail

  config:
    global:
      resolve_timeout: 5m 
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: add-your-email
      smtp_auth_username: add-your-email
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-gmail/password
      smtp_require_tls: true

    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m 
      repeat_interval: 4h
      routes:
        - receiver: email
          matchers:
            - 'notify = "email"'

    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: add-your-email
            send_resolved: true