apiVersion: v1
kind: ConfigMap
metadata:
  name: django-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  django-app.json: |
    {
      "uid": "django-app-monitoring",
      "title": "Django App Monitoring",
      "tags": [
        "django",
        "monitoring-demo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "ds_prometheus",
            "type": "datasource",
            "query": "prometheus",
            "hide": 2,
            "current": {}
          },
          {
            "name": "ds_loki",
            "type": "datasource",
            "query": "loki",
            "hide": 2,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests / sec",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum(rate(django_http_requests_total_by_method_total{namespace=\"monitoring-demo\"}[1m]))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error rate (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "(sum(rate(django_http_responses_total_by_status_total{namespace=\"monitoring-demo\",status=~\"5..\"}[2m])) or vector(0)) / sum(rate(django_http_responses_total_by_status_total{namespace=\"monitoring-demo\"}[2m]))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{namespace=\"monitoring-demo\"}[5m])))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Items created (total)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum(shop_items_created_total{namespace=\"monitoring-demo\"})",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests / sec by endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (view) (rate(django_http_requests_total_by_view_transport_method_total{namespace=\"monitoring-demo\"}[1m]))",
              "legendFormat": "{{view}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Responses / sec by status code",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (status) (rate(django_http_responses_total_by_status_total{namespace=\"monitoring-demo\"}[1m]))",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latency percentiles",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{namespace=\"monitoring-demo\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{namespace=\"monitoring-demo\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{namespace=\"monitoring-demo\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "DB queries / sec",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (vendor) (rate(django_db_execute_total{namespace=\"monitoring-demo\"}[1m]))",
              "legendFormat": "{{vendor}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pod restarts (10m)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 18,
            "y": 12,
            "w": 6,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"monitoring-demo\"}[10m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Log lines / min by level",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "sum by (levelname) (count_over_time({namespace=\"monitoring-demo\", container=\"django\"} | json | __error__=\"\" [1m]))",
              "legendFormat": "{{levelname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Errors (5xx)",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "{namespace=\"monitoring-demo\", container=\"django\"} | json | status >= 500",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 12,
          "type": "logs",
          "title": "All app logs",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "x": 12,
            "y": 26,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "{namespace=\"monitoring-demo\", container=\"django\"} | json",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        }
      ]
    }